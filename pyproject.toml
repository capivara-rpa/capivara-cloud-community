[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capivara-cloud"
version = "0.1.0"
description = "Automação de APIs em português, com workflows visuais e conectores prontos."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Capivara", email = "capivara@arthurfaria.tech" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "cryptography>=42,<47",
    "openpyxl>=3.1,<4",
    "google-auth>=2.34,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.6,<1"]

[project.scripts]
capivara-cloud = "app.main:main"

[project.urls]
Homepage = "https://github.com/capivara-rpa/capivara-cloud"
Repository = "https://github.com/capivara-rpa/capivara-cloud"
Community = "https://github.com/capivara-rpa/capivara-cloud-community"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "static/vendor/*", "static/img/*", "static/img/logos/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
